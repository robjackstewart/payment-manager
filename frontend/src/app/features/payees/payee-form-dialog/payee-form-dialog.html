<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formRoot]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput [formField]="form.name" placeholder="Enter name" />
      @if (nameError()) {
        <mat-error>{{ nameError() }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="submitDisabled()">
    {{ submitLabel }}
  </button>
</mat-dialog-actions>
