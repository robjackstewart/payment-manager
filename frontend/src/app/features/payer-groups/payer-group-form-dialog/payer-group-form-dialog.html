<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formRoot]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput [formField]="form.name" placeholder="e.g. Family" />
      @if (nameError()) {
        <mat-error>{{ nameError() }}</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Members</mat-label>
      <mat-select [formField]="form.personIds" multiple>
        @for (person of people; track person.id) {
          <mat-option [value]="person.id">{{ person.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="submitDisabled()">
    {{ submitLabel }}
  </button>
</mat-dialog-actions>
